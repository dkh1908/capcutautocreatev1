<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan - Panel CapCut</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#141416',
                        'panel-bg': '#1C1C22',
                        'input-bg': '#16161B',
                        'brand-gold': '#D4A353',
                        'brand-gold-hover': '#b5873d',
                        'text-muted': '#A0A0A5'
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #141416;
        }
    </style>
</head>
<body class="min-h-screen text-white p-4 md:p-6 flex flex-col items-center">

    <!-- Kontainer Utama -->
    <div class="w-full max-w-2xl bg-panel-bg rounded-xl shadow-2xl border border-gray-800 p-6 md:p-8 mt-6 md:mt-10">
        
        <!-- Header & Tombol Kembali -->
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-5">
            <h2 class="text-2xl font-bold text-white flex items-center gap-3">
                <i class="fa-solid fa-gear text-brand-gold"></i> Pengaturan
            </h2>
            <a href="dashboard.html" class="text-sm border border-gray-600 hover:bg-gray-800 text-gray-300 py-2 px-5 rounded-full transition flex items-center gap-2 font-medium">
                <i class="fa-solid fa-arrow-left"></i> KEMBALI
            </a>
        </div>

        <form id="settingForm" class="space-y-6">
            
            <!-- Blok 1: Ubah Password Panel -->
            <div class="bg-dark-bg p-6 rounded-lg border border-gray-800">
                <h3 class="text-brand-gold font-bold mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-lock"></i> Keamanan Akun Panel
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-text-muted mb-2">Password Lama</label>
                        <input type="password" id="oldPassword" class="w-full bg-input-bg border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-brand-gold" placeholder="Masukkan password lama">
                    </div>
                    <div>
                        <label class="block text-sm text-text-muted mb-2">Password Baru</label>
                        <input type="password" id="newPassword" class="w-full bg-input-bg border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-brand-gold" placeholder="Masukkan password baru">
                    </div>
                </div>
            </div>

            <!-- Blok 2: Konfigurasi CapCut -->
            <div class="bg-dark-bg p-6 rounded-lg border border-gray-800">
                <h3 class="text-brand-gold font-bold mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-scissors"></i> Konfigurasi CapCut
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-text-muted mb-2">Password Akun CapCut</label>
                        <!-- Menggunakan type="text" agar password capcut yang diatur bisa terlihat oleh pengguna -->
                        <input type="text" id="capcutPassword" class="w-full bg-input-bg border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-brand-gold" placeholder="Masukkan password default untuk pembuatan akun CapCut">
                    </div>
                </div>
            </div>

            <!-- Tombol Simpan -->
            <button type="submit" id="btnSimpan" class="w-full bg-brand-gold hover:bg-brand-gold-hover text-black font-bold py-4 rounded-lg mt-8 transition flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(212,163,83,0.2)]">
                <i class="fa-solid fa-floppy-disk"></i> SIMPAN PENGATURAN
            </button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Ambil data yang sudah disimpan sebelumnya (jika ada) dan tampilkan di kolom input
            const savedCapcutPassword = localStorage.getItem('capcut_custom_password');
            if (savedCapcutPassword) {
                document.getElementById('capcutPassword').value = savedCapcutPassword;
            }

            document.getElementById('settingForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const btn = document.getElementById('btnSimpan');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> MENYIMPAN...';
                btn.disabled = true;

                // Proses menyimpan password ke LocalStorage Browser
                const newCapcutPass = document.getElementById('capcutPassword').value.trim();
                
                if (newCapcutPass) {
                    localStorage.setItem('capcut_custom_password', newCapcutPass);
                } else {
                    // Jika dikosongkan, kembali ke default
                    localStorage.setItem('capcut_custom_password', 'masuk123'); 
                }

                setTimeout(() => {
                    alert("Pengaturan Password CapCut berhasil disimpan!");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 1000);
            });
        });
    </script>
</body>
</html>
