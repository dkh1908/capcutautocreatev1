<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Kontrol CapCut</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#141416',
                        'panel-bg': '#1C1C22',
                        'input-bg': '#16161B',
                        'brand-gold': '#D4A353',
                        'brand-gold-hover': '#b5873d',
                        'text-muted': '#A0A0A5'
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #141416;
        }
        /* Custom scrollbar untuk tabel riwayat jika di HP */
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1C1C22;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4B5563;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen text-white p-4 md:p-6 flex flex-col items-center">

    <!-- Kontainer Utama -->
    <div class="w-full max-w-3xl bg-panel-bg rounded-xl shadow-2xl border border-gray-800 p-6 md:p-8 mt-6 md:mt-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">
                Panel Kontrol <span class="text-brand-gold">CapCut</span>, <span id="namaUser" class="text-brand-gold">Memuat...</span>!
            </h1>
            <div class="text-text-muted text-sm flex items-center justify-center gap-3">
                <span><i class="fa-solid fa-crown mr-1 text-brand-gold"></i> Role: Member</span>
                <span class="text-gray-600">|</span>
                <span><i class="fa-solid fa-clock mr-1"></i> Expired: <span id="waktuExpired" class="text-brand-gold">Memuat...</span></span>
            </div>
        </div>

        <!-- Tombol Menu Atas -->
        <div class="flex flex-wrap justify-center gap-3 mb-6">
            <button class="bg-brand-gold hover:bg-brand-gold-hover text-black font-semibold py-2 px-6 rounded-full transition flex items-center gap-2">
                <i class="fa-solid fa-rocket"></i> Auto Daftar
            </button>
            <button onclick="window.location.href='gabung-tim.html'" class="bg-transparent border border-gray-600 hover:bg-gray-800 text-gray-300 font-medium py-2 px-6 rounded-full transition flex items-center gap-2">
                <i class="fa-solid fa-users"></i> Hanya Gabung Tim
            </button>
        </div>

        <!-- Tombol Sub-Menu -->
        <div class="flex justify-center gap-3 mb-8">
            <button onclick="window.location.href='setting.html'" class="bg-transparent border border-gray-600 hover:bg-gray-800 text-gray-300 font-medium py-2 px-6 rounded-full transition flex items-center gap-2">
                <i class="fa-solid fa-gear"></i> Pengaturan
            </button>
            <button class="bg-transparent border border-red-500 hover:bg-red-900/30 text-red-500 font-medium py-2 px-6 rounded-full transition flex items-center gap-2">
                <i class="fa-solid fa-crown"></i> Panel Admin
            </button>
        </div>

        <!-- Formulir Input -->
        <div class="space-y-5 border-t border-gray-800 pt-8">
            <div>
                <label class="block text-sm text-text-muted mb-2">Jumlah Akun yang Dibuat:</label>
                <input type="number" id="inputJumlahAkun" value="1" class="w-full bg-input-bg border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-brand-gold">
            </div>

            <div>
                <label class="block text-sm text-text-muted mb-2">Link Invite Tim (Opsional, Max 17):</label>
                <textarea id="inputLinkInvite" rows="4" class="w-full bg-input-bg border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-brand-gold resize-none" placeholder="https://capcut.com/invite/1&#10;https://capcut.com/invite/2&#10;(Satu link per baris)"></textarea>
            </div>

            <button id="btnMulaiProses" class="w-full bg-brand-gold hover:bg-brand-gold-hover text-black font-bold py-3.5 rounded-lg mt-4 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-rocket"></i> MULAI PROSES
            </button>
        </div>

        <!-- Bagian Riwayat Proses Terkini -->
        <div class="mt-8 pt-6">
            <!-- Header Riwayat & Tombol Hapus Utama -->
            <div class="flex items-center gap-4 mb-4">
                <div class="flex items-start gap-2 text-brand-gold font-bold">
                    <i class="fa-solid fa-clock-rotate-left mt-1 text-lg"></i>
                    <h3 class="text-[13px] leading-tight uppercase">Riwayat<br>Proses</h3>
                </div>
                <button id="btnHapusRiwayat" class="flex-1 border border-red-900 bg-red-950/20 text-red-500 hover:bg-red-900/40 py-2.5 rounded-full transition flex items-center justify-center gap-2 text-[11px] font-bold tracking-widest">
                    <i class="fa-solid fa-trash"></i> HAPUS RIWAYAT
                </button>
            </div>
            
            <!-- Tabel Data -->
            <div class="w-full overflow-x-auto custom-scrollbar pb-2">
                <div class="min-w-[650px]">
                    
                    <!-- Judul Kolom -->
                    <div class="grid grid-cols-12 gap-2 text-[10px] font-bold text-brand-gold uppercase pb-3 mb-2 border-b border-gray-800 tracking-wider">
                        <div class="col-span-3">WAKTU (SELESAI)</div>
                        <div class="col-span-3">TIPE PROSES</div>
                        <div class="col-span-2 text-center">TOTAL AKUN</div>
                        <div class="col-span-1 text-center">BERHASIL</div>
                        <div class="col-span-1 text-center">GAGAL</div>
                        <div class="col-span-2 text-center">AKSI</div>
                    </div>
                    
                    <!-- Wadah List Baris Riwayat -->
                    <div id="wadahRiwayat" class="flex flex-col">
                        <div class="py-6 text-center text-gray-600 text-xs italic">
                            Belum ada data riwayat proses.
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Tombol Logout -->
            <button id="btnLogout" class="w-full mt-6 border border-gray-700 hover:bg-gray-800 text-gray-400 py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm font-semibold tracking-wide">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> LOGOUT
            </button>
        </div>
        
    </div>

    <!-- Script JavaScript Terpadu -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. CEK LOGIN & TAMPILKAN DATA
            const username = localStorage.getItem('panel_username');
            const expiredRaw = localStorage.getItem('panel_expired');

            if (!username) {
                document.getElementById('namaUser').textContent = "Demo User";
            } else {
                document.getElementById('namaUser').textContent = username;
            }

            if (expiredRaw) {
                const expDate = new Date(expiredRaw);
                const options = { day: 'numeric', month: 'long', year: 'numeric' };
                const formattedDate = expDate.toLocaleDateString('id-ID', options);
                document.getElementById('waktuExpired').textContent = formattedDate;
            }

            // 2. TOMBOL MULAI PROSES TERHUBUNG KE PYTHON
            document.getElementById('btnMulaiProses').addEventListener('click', async function() {
                const jumlahAkun = document.getElementById('inputJumlahAkun').value;
                const linkInvite = document.getElementById('inputLinkInvite').value;

                if (!jumlahAkun || jumlahAkun <= 0) {
                    alert("Mohon masukkan jumlah akun yang valid.");
                    return;
                }

                const btn = this;
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> MEMPROSES BOT... JANGAN TUTUP BROWSER';
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');

                try {
                    // Ambil password kustom, jika belum diatur gunakan default
                    const customPassword = localStorage.getItem('capcut_custom_password') || 'CapcutTeam123!';

                    // Mengirim perintah ke Python via URL Ngrok Permanen
                    const response = await fetch('https://suing-retiree-luckily.ngrok-free.dev/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            jumlah: parseInt(jumlahAkun),
                            links: linkInvite,
                            password: customPassword
                        })
                    });

                    const hasil = await response.json();
                    
                    if(hasil.status === 'success') {
                        
                        let aksiHtml = `<div class="col-span-2 text-center text-green-400"><i class="fa-solid fa-check"></i> Selesai</div>`;
                        
                        // --- FITUR UNDUH ---
                        if (hasil.akun_list && hasil.akun_list.length > 0) {
                            const textContent = hasil.akun_list.join('\n');
                            const blob = new Blob([textContent], { type: 'text/plain' });
                            const fileUrl = URL.createObjectURL(blob);
                            const namaFile = `Akun_CapCut_${hasil.waktu_selesai.replace(/:/g, '')}.txt`;
                            
                            // Menambahkan tombol fisik Unduh ke dalam tabel
                            aksiHtml = `
                                <div class="col-span-2 text-center flex flex-col items-center justify-center gap-1">
                                    <a href="${fileUrl}" download="${namaFile}" class="bg-brand-gold text-black px-3 py-1 rounded text-[10px] font-bold hover:bg-yellow-600 transition shadow-lg">
                                        <i class="fa-solid fa-download"></i> UNDUH
                                    </a>
                                </div>
                            `;

                            // Pemicu Unduh Otomatis (Jika diizinkan browser)
                            try {
                                const a = document.createElement('a');
                                a.href = fileUrl;
                                a.download = namaFile;
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                            } catch(e) {
                                console.log("Unduhan otomatis ditahan browser, bisa gunakan tombol unduh manual.");
                            }
                            
                            alert(`Proses selesai!\nBerhasil: ${hasil.berhasil}\nGagal: ${hasil.gagal}\n\nSilakan cek file unduhan atau klik tombol UNDUH di tabel.`);
                        } else {
                            alert(`Proses selesai!\nBerhasil: 0\nGagal: ${hasil.gagal}\n\nTidak ada akun yang berhasil dibuat.`);
                        }

                        // --- UPDATE TABEL RIWAYAT ---
                        const wadahRiwayat = document.getElementById('wadahRiwayat');
                        if (wadahRiwayat.innerHTML.includes('Belum ada data riwayat proses.')) {
                            wadahRiwayat.innerHTML = '';
                        }

                        const barisHTML = `
                            <div class="grid grid-cols-12 gap-2 text-[11px] font-medium text-gray-300 py-3 border-b border-gray-800/50 hover:bg-white/10 transition px-2 rounded items-center">
                                <div class="col-span-3 text-brand-gold">${hasil.waktu_selesai}</div>
                                <div class="col-span-3">Auto Daftar</div>
                                <div class="col-span-2 text-center text-blue-400 font-bold">${hasil.total}</div>
                                <div class="col-span-1 text-center text-green-500 font-bold">${hasil.berhasil}</div>
                                <div class="col-span-1 text-center text-red-500 font-bold">${hasil.gagal}</div>
                                ${aksiHtml}
                            </div>
                        `;
                        wadahRiwayat.insertAdjacentHTML('afterbegin', barisHTML);
                    }
                } catch (error) {
                    alert("Gagal terhubung ke Script Python! Pastikan terminal app.py dan Ngrok sudah berjalan.");
                    console.error(error);
                } finally {
                    // Kembalikan tombol
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            });

            // 3. TOMBOL HAPUS SEMUA RIWAYAT
            document.getElementById('btnHapusRiwayat').addEventListener('click', function() {
                const wadah = document.getElementById('wadahRiwayat');
                if (wadah.innerHTML.includes('Belum ada data riwayat proses.')) {
                    alert('Riwayat sudah kosong.');
                    return;
                }
                if (confirm('Apakah Anda yakin ingin menghapus seluruh riwayat proses?')) {
                    wadah.innerHTML = `
                        <div class="py-6 text-center text-gray-600 text-xs italic">
                            Belum ada data riwayat proses.
                        </div>
                    `;
                }
            });

            // 4. TOMBOL LOGOUT
            document.getElementById('btnLogout').addEventListener('click', function() {
                if (confirm('Anda yakin ingin keluar dari panel?')) {
                    localStorage.removeItem('panel_username');
                    localStorage.removeItem('panel_expired');
                    window.location.href = 'index.html';
                }
            });
        });
    </script>
</body>
</html>
